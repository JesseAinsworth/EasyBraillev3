services:
  - type: web
    name: easybraille-api
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt && python download_model.py"
    startCommand: "gunicorn app:app"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PORT
        value: 10000
